    function restore(s){s=s?.privateContent||s||{};if(['rod','cable','home','sensitivity'].includes(s.chapter))chapter=s.chapter;if(Number.isInteger(s.corner))corner=clamp(s.corner,0,3);if(Number.isFinite(s.time))time=clamp(s.time,0,data.duration-.001);if(typeof s.playing==='boolean')playing=s.playing;}
    function stateAt(t){
      const frames=data.frames;let lo=0,hi=frames.length-1;while(hi-lo>1){const mid=(lo+hi)>>1;if(frames[mid].t<=t)lo=mid;else hi=mid;}
      const a=frames[lo],b=frames[hi],f=clamp((t-a.t)/(b.t-a.t),0,1);
      const tip=lerp(a.tip,b.tip,f),n=unit(lerp(a.n,b.n,f)),p=solve(tip,n,lerp(a.p,b.p,f)),offsets=a.o.map((o,i)=>lerp(o,b.o[i],f));
      const routes=data.modules.map((pod,i)=>route(p.lugs[i],pod,offsets[i]));return {p,offsets,routes,frame:a,requested:tip};
    }
    const color=i=>`var(--viz-series-${i+1})`;
    function E(parent,type,attrs={},text){const e=document.createElementNS(NS,type);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
    const label=(parent,p,t,anchor='start')=>E(parent,'text',{x:p[0],y:p[1],'text-anchor':anchor},t);
    function line(parent,pts,stroke='var(--border)',width=1,dash){return E(parent,'polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke,'stroke-width':width,...(dash?{'stroke-dasharray':dash}:{})});}
    function circle(parent,p,r,fill,stroke='none'){return E(parent,'circle',{cx:p[0],cy:p[1],r,fill,stroke});}
    const project=p=>{const d=sub(p,data.q);return [dot(d,[.8944,.4472,0]),-dot(d,[-.1952,.3904,.8997])];};
    const bounds=[];for(const f of data.frames){for(let i=0;i<4;i++)bounds.push(project(add(data.modules[i].feed_world_mm,f.o[i])));bounds.push(project(f.tip));}bounds.push(project(add(data.q,[0,0,80])));
    const minX=Math.min(...bounds.map(p=>p[0]))-30,maxX=Math.max(...bounds.map(p=>p[0]))+30,minY=Math.min(...bounds.map(p=>p[1]))-25,maxY=Math.max(...bounds.map(p=>p[1]))+25;
    function scene(s){
      const W=Math.max(280,svg.clientWidth),H=W<450?300:330;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.height=H+'px';svg.replaceChildren();
      const scale=Math.min((W-60)/(maxX-minX),(H-45)/(maxY-minY));
      const P=p=>{const v=project(p);return [W/2+(v[0]-(minX+maxX)/2)*scale,20+(v[1]-minY)*scale];};
      for(let i=0;i<4;i++){
        const r=s.routes[i],c=color(i),f=P(r.F),a=P(add(r.F,mul(r.a,-40)));
        const shape=E(svg,'g',{'data-corner':i});line(shape,[P(data.modules[i].feed_world_mm),f],'var(--border)',1,'3 3');line(shape,[a,f],c,2);
        circle(shape,f,5,c);line(shape,[...r.wrap.map(P),P(r.B)],c,i===corner?2.8:1.2);circle(shape,P(r.B),3,c);
        E(shape,'rect',{x:a[0]-8,y:a[1]-10,width:16,height:20,rx:2,fill:'var(--muted)',stroke:i===corner?'var(--foreground)':'var(--border)','stroke-width':1});
        label(shape,[a[0]+12,a[1]+4],String(i+1));
        const hit=circle(shape,a,20,'transparent');hit.setAttribute('class','cursor-interaction');hit.addEventListener('click',()=>{corner=i;change();});
      }
      const points=[data.q,s.p.p,s.p.c1,s.p.c2,s.p.tip];line(svg,points.map(P),'var(--foreground)',chapter==='rod'?3:2);
      for(let j=0;j<points.length;j++)circle(svg,P(points[j]),j<2?4:3,'var(--background)','var(--foreground)');
      label(svg,add(P(data.q),[10,-8]),'Q');label(svg,add(P(s.p.p),[10,3]),'P');label(svg,add(P(s.p.tip),[10,5]),'t');
      const ax=[W-57,H-28];for(const [d,t]of [[[27,0],'X'],[[-13,13],'Y'],[[0,-28],'Z']]){line(svg,[ax,add(ax,d)],'var(--muted-foreground)');label(svg,add(add(ax,d),[3,0]),t);}
      const note=chapter==='rod'?'Guide → collar → wrist → tool':`Module ${corner+1}: L = ${fmt(s.routes[corner].L,1)} mm`;label(svg,[10,H-8],note);
    }
    function eq(formula,value){return `<div class="ik-equation">${formula}<span class="ik-value tabular-nums">${value}</span></div>`;}
    function point(parent,p,name,c='var(--viz-series-1)',delta=[5,-7]){circle(parent,p,3.5,c);label(parent,add(p,delta),name);}
    function geometry(s){
      const r=s.routes[corner],p=s.p,W=Math.max(280,mini.clientWidth),H=250;mini.style.height=H+'px';mini.setAttribute('viewBox',`0 0 ${W} ${H}`);mini.replaceChildren();
      let html='';const c=color(corner);
      if(chapter==='rod'){
        view('mini-title').textContent='Rod and separated wrist centres';
        const q=[W*.48,25],a=[W*.40,100],b=[W*.47,133],d=[W*.41,167],t=[W*.49,228];
        line(mini,[q,a,b,d,t],'var(--foreground)',2);[[q,'Q'],[a,'P'],[b,'C₁'],[d,'C₂'],[t,'t']].forEach(([x,name])=>point(mini,x,name));
        label(mini,[W*.04,121],'30 mm');label(mini,[W*.63,157],'28 mm');label(mini,[W*.05,206],'60 mm');
        html+=eq('ẑ = (Q − P) / ‖Q − P‖',`P − Q = ${vec(sub(p.p,data.q))} mm`);
        html+=eq('α = atan2(−ẑᵧ, ẑ𝓏); β = asin(ẑₓ)',`α = ${fmt(deg(p.alpha))}°; β = ${fmt(deg(p.beta))}°`);
        html+=eq('R = Rₓ(α)Rᵧ(β); w = Rᵀn',`n = ${vec(p.n,3)}`);
        html+=eq('p = atan2(wₓ,w𝓏); q = −asin(wᵧ)',`pitch = ${fmt(deg(p.pitch))}°; roll = ${fmt(deg(p.roll))}°`);
        html+=eq('Rₘ = RRᵧ(p); Rₜ = RₘRₓ(q)','Rod, middle joint and tool rotations');
        html+=eq('t(P,n) = P − 30Re𝓏 − 28Rₘe𝓏 − 60Rₜe𝓏',`t − Q = ${vec(sub(p.tip,data.q))} mm`);
        html+=eq('Pₖ₊₁ = Pₖ − Jₜ⁻¹[t(Pₖ,n) − t*]',`Jₜ = ∂t/∂P; residual ${p.error.toExponential(1)} mm (numerical)`);
        html+=eq('Bᵢ = P + Rbᵢ',`b${corner+1} = ${vec(bs[corner],0)}; B${corner+1} − Q = ${vec(sub(r.B,data.q))} mm`);
        view('detail').textContent='b₁=(−12,−12,0), b₂=(−12,12,0), b₃=(12,12,0), b₄=(12,−12,0) mm';
      } else if(chapter==='cable'){
        view('mini-title').textContent=`Module ${corner+1} · actual pulley plane`;
        const k=Math.min((W-72)/(r.h+20),160/Math.max(r.v,70)),origin=[30,62],P=(x,y)=>[origin[0]+x*k,origin[1]+y*k];
        line(mini,[P(0,0),P(r.h,0),P(r.h,r.v)],'var(--border)',1,'3 3');
        E(mini,'circle',{cx:P(15,0)[0],cy:P(15,0)[1],r:15*k,fill:'none',stroke:'var(--border)'});
        const arc=r.wrap.map(x=>{const d=sub(x,r.F);return P(dot(d,r.e),dot(d,r.a));}),tp=arc[arc.length-1];
        line(mini,[P(0,-45),...arc,P(r.h,r.v)],c,2.5);circle(mini,P(0,0),3,c);circle(mini,P(15,0),2,'var(--foreground)');circle(mini,tp,3,c);circle(mini,P(r.h,r.v),4,c);
        label(mini,[6,43],'Fᵢ');line(mini,[P(15,0),[94,35]],'var(--border)');label(mini,[96,34],'Cᵢ');line(mini,[tp,[100,100]],'var(--border)');label(mini,[102,105],'Tᵢ');label(mini,add(P(r.h,r.v),[-8,20]),'Bᵢ','end');
        label(mini,[W*.48,49],`h = ${fmt(r.h,1)}`);label(mini,[W-5,H*.57],`v = ${fmt(r.v,1)}`,'end');label(mini,[8,H-8],`r = 15 mm; wrap θ = ${fmt(deg(r.theta),1)}°`);
        html+=eq('Fᵢ = Oᵢ + Uᵢf; aᵢ = Uᵢ(0,−1,0)',`F${corner+1} − Q = ${vec(sub(r.F,data.q))} mm`);
        html+=eq('f = (23,−140,65); oᵢ = Uᵢ(0,0,1)',`a${corner+1} = ${vec(r.a,3)}; local f in mm`);
        html+=eq('dᵢ = Bᵢ − Fᵢ; vᵢ = aᵢ · dᵢ',`d = ${vec(r.d)} mm; v = ${fmt(r.v)} mm`);
        html+=eq('hᵢ = ‖dᵢ − vᵢaᵢ‖; eᵢ = (dᵢ − vᵢaᵢ)/hᵢ',`h = ${fmt(r.h)} mm; e = ${vec(r.e,3)}`);
        html+=eq('Cᵢ = Fᵢ + reᵢ; ρᵢ = √[(hᵢ−r)² + vᵢ²]',`ρ = ${fmt(r.rho)} mm`);
        html+=eq('θᵢ = atan2(vᵢ, r−hᵢ) − acos(r/ρᵢ)',`θ = ${fmt(deg(r.theta))}°; valid branch 0 < θ < π`);
        html+=eq('Tᵢ = Cᵢ + r(−eᵢ cos θᵢ + aᵢ sin θᵢ)',`T − Q = ${vec(sub(r.T,data.q))} mm`);
        html+=eq('ψᵢ = atan2[aᵢ · (oᵢ × eᵢ), oᵢ · eᵢ]',`swivel ψ = ${fmt(deg(r.psi))}°`);
        html+=eq('Lᵢ = Lᵢₙ + rθᵢ + √(ρᵢ² − r²)',`${fmt(r.inlet)} + ${fmt(r.arc)} + ${fmt(r.free)} = ${fmt(r.L)} mm`);
        view('detail').textContent='Oᵢ: module origin · Uᵢ: installed rotation · Fᵢ: feed · Tᵢ: outgoing tangent';
      } else if(chapter==='home'){
        view('mini-title').textContent=`Module ${corner+1} · bead reference and payout`;
        const bead=data.beads[corner],gap=r.free-bead-16,k=(W-55)/r.free,a=[25,72],b=[W-30,72],receiver=[25+16*k,72],beadpoint=[25+(r.free-bead)*k,72];
        line(mini,[a,b],c,2);point(mini,a,'Tᵢ');point(mini,b,'Bᵢ',c,[-17,-12]);circle(mini,receiver,7,'none','var(--foreground)');circle(mini,beadpoint,5,c);
        label(mini,[18,112],'Receiver: 16 mm');label(mini,[W-10,144],`Bead gap ${fmt(gap)} mm`,'end');
        const center=[W*.5,207];circle(mini,center,24,'none','var(--foreground)');const phi=(r.L-data.refs[s.frame.layout][corner])/20;line(mini,[center,add(center,[24*Math.cos(phi),-24*Math.sin(phi)])],c,2);label(mini,[W*.5+34,213],'Rᵈ = 20 mm');
        const home=data.refs[s.frame.layout][corner],delta=r.L-home;
        html+=eq('At trip: ‖Bᵢ − Tᵢ‖ = sᵢ + 16',`fixed bead s = ${fmt(bead)} mm; trip span = ${fmt(bead+16)} mm`);
        html+=eq('gᵢ = free span − (sᵢ + 16)',`g = ${fmt(gap)} mm; ${gap<=1e-5?'switch tripped':'switch clear'}`);
        html+=eq('Lᵢ,home = inlet + wrap + free at latch',`${s.frame.latched[corner]?'LATCHED':'Pending latch'}; layout reference = ${fmt(home)} mm`);
        html+=eq('ΔLᵢ = Lᵢ − Lᵢ,home',`${fmt(r.L)} − ${fmt(home)} = ${fmt(delta)} mm`);
        html+=eq('Δφᵢ = ΔLᵢ / Rᵈ',`${fmt(phi,4)} rad; positive = payout`);
        html+=eq('ΔNᵢ = ΔLᵢ / (2πRᵈ)',`${fmt(delta/(2*Math.PI*20),4)} revolutions`);
        view('detail').textContent='Four scalar home references ≠ twelve unknown mount coordinates. Geometry remains an input.';
      } else {
        view('mini-title').textContent=`Module ${corner+1} · local length sensitivity`;
        const x0=W/2,scale=(W-100)/2;
        line(mini,[[x0,25],[x0,184]],'var(--border)');
        r.gradient.forEach((g,i)=>{const y=48+i*58;label(mini,[8,y+5],['X','Y','Z'][i]);E(mini,'rect',{x:Math.min(x0,x0+g*scale),y:y-8,width:Math.abs(g)*scale,height:16,fill:c});label(mini,[W-5,y+5],fmt(g,3),'end');});
        label(mini,[W/2,220],'mm of cable / mm of mount motion','middle');
        html+=eq('uᵢ = (Bᵢ − Tᵢ) / ‖Bᵢ − Tᵢ‖',`u = ${vec(r.u,3)}`);
        html+=eq('dLᵢ = uᵢᵀ dBᵢ − uᵢᵀ dFᵢ','Module orientation fixed');
        html+=eq('Fixed tool: ∇Fᵢ Lᵢ = −uᵢ',`(${r.gradient.map(x=>fmt(x,3)).join(', ')}) mm/mm`);
        html+=eq('Fixed mounts: L̇ = J Ṗ','Four cable rates from three collar velocity components');
        html+=eq('Jᵢⱼ = uᵢᵀ[eⱼ + (∂R/∂Pⱼ)bᵢ]','Lug motion includes the main rod’s change of angle');
        const baseline=route(r.B,data.modules[corner],[0,0,0]);
        html+=eq('Finite relocation: ΔL = Lnew − Lbase',`${fmt(r.L-baseline.L)} mm at the same tool pose`);
        view('detail').textContent='Differential approximation locally; full nonlinear inverse for finite moves. Tension feasibility is a separate check.';
      }
      view('equations').innerHTML=html;
    }
    function render(){
      try{
        current=stateAt(time);scene(current);geometry(current);
        view('stage').textContent=`Layout ${current.frame.layout+1}/3 · ${current.frame.stage.toLowerCase()} · ${current.frame.phase}`;
        view('legend').innerHTML=current.routes.map((r,i)=>`<span class="ik-swatches tabular-nums"><span class="ik-dot" style="background:${color(i)}"></span>${i+1}: ${fmt(r.L,1)} mm</span>`).join('');
        $('#scanner-ik-time').value=time/data.duration*100;view('clock').textContent=fmt(time,0)+' s';
        $('[data-action="play"]').textContent=playing?'Pause':'Play';$('[data-control="chapter"]').value=chapter;$('[data-control="corner"]').value=corner;
      }catch(e){view('stage').textContent='Geometry error: '+e.message;playing=false;throw e;}
    }
    function save(){}
    function change(){render();view('announce').textContent=`${chapter}, module ${corner+1}`;save();}
    $('[data-action="play"]').addEventListener('click',()=>{playing=!playing;last=performance.now();change();});
    $('[data-control="chapter"]').addEventListener('change',e=>{chapter=e.target.value;change();});
    $('[data-control="corner"]').addEventListener('change',e=>{corner=Number(e.target.value);change();});
    $('#scanner-ik-time').addEventListener('input',e=>{playing=false;time=Number(e.target.value)/100*data.duration;render();});$('#scanner-ik-time').addEventListener('change',save);
    new ResizeObserver(()=>render()).observe(root);
    function tick(now){const dt=Math.min(.12,(now-last)/1000);last=now;if(playing&&document.visibilityState!=='hidden'){time=(time+dt)%data.duration;if(now-lastDraw>60){render();lastDraw=now;}}requestAnimationFrame(tick);}
    root._ik={data,pose,solve,route,stateAt,render,get current(){return current;}};
    render();requestAnimationFrame(tick);
  })();
  </script>
</div>
