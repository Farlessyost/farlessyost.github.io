<figure class="research-figure">
  <a class="figure-link" href="{{ include.src | relative_url }}" aria-label="View full-size figure: {{ include.alt | escape }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy"></a>
  <figcaption>{{ include.caption }} <a href="{{ include.src | relative_url }}">View full size</a></figcaption>
</figure>
