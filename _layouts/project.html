---
layout: default
---
<article class="case-study">
  <header class="case-header shell">
    <a class="back-link" href="{{ '/projects/' | relative_url }}">← All work</a>
    <p class="eyebrow">{{ page.category }} <span class="label-divider">/</span> {{ page.status }}</p>
    <h1>{{ page.title }}</h1>
    <p class="case-deck">{{ page.description }}</p>
    <dl class="case-facts"><div><dt>Focus</dt><dd>{{ page.focus }}</dd></div><div><dt>Methods</dt><dd>{{ page.methods }}</dd></div><div><dt>Context</dt><dd>{{ page.context }}</dd></div></dl>
  </header>
  <div class="case-body shell">{{ content }}</div>
  <div class="case-end shell"><p class="eyebrow">Continue exploring</p><a class="next-project" href="{{ page.next_url | relative_url }}">{{ page.next_title }} <span aria-hidden="true">↗</span></a><a class="text-link" href="{{ '/projects/' | relative_url }}">Back to all work</a></div>
</article>
